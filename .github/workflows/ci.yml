name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reduckhunt:
    name: ReDuckHunt (script tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/ReDuckHunt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ReDuckHunt/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test
