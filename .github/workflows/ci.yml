name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reduckhunt:
    name: ReDuckHunt (script tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/ReDuckHunt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ReDuckHunt/package-lock.json
      - run: npm ci
      - name: Run tests
        id: test
        run: npm test
      - name: Markdown summary
        if: always()
        run: |
          if [ -f test-results/report.md ]; then
            cat test-results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ReDuckHunt report" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`test-results/report.md\` produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reduckhunt-test-results
          path: tools/ReDuckHunt/test-results/
          if-no-files-found: ignore
